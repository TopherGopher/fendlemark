name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated pages are current
        run: |
          python3 site/tools/build.py
          python3 site/tools/linkcheck.py
          git diff --exit-code -- site/public || { echo "Run python3 site/tools/build.py and commit the output."; exit 1; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
          include-hidden-files: true  # .well-known/ and .nojekyll
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Submit changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 site/tools/indexnow.py "$BEFORE"
  bing:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Submit the sitemap to Bing Webmaster Tools
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: python3 site/tools/bing.py
